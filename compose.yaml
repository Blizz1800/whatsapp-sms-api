services:
  api:
    build: .
    depends_on:
      database:
        condition: service_healthy

    env_file:
      - .env
    environment:
      - DB_TYPE=${DB_TYPE:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:mysecretpassword@database:5432/mydatabase}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - MSG_RETENTION_DAYS=${MSG_RETENTION_DAYS:-30}
      - SEND_RATE_PER_MINUTE=${SEND_RATE_PER_MINUTE:-20}
      - SEND_TIMEOUT_SECONDS=${SEND_TIMEOUT_SECONDS:-15}
      - MAX_SEND_ATTEMPTS=${MAX_SEND_ATTEMPTS:-3}
      - RETRY_BACKOFF_SECONDS=${RETRY_BACKOFF_SECONDS:-30}
      - RETRY_BACKOFF_MAX_SECONDS=${RETRY_BACKOFF_MAX_SECONDS:-300}
      - JOB_POLL_INTERVAL_MS=${JOB_POLL_INTERVAL_MS:-500}
      - JOB_STALE_SECONDS=${JOB_STALE_SECONDS:-300}
      - JOB_SWEEP_INTERVAL=${JOB_SWEEP_INTERVAL:-60s}
      - SYNC_WAIT_SECONDS=${SYNC_WAIT_SECONDS:-30}
      - UPDATES_BUFFER_SIZE=${UPDATES_BUFFER_SIZE:-1000}
    restart: unless-stopped
    networks:
        - whatsapp

  database:
    image: postgres:alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
        - whatsapp

networks:
    whatsapp:
        driver: bridge

volumes:
  pgdata:
